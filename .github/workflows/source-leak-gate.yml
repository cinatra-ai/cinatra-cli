name: source-leak-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-leak-gate:
    uses: cinatra-ai/ci/.github/workflows/source-leak-gate.yml@00ac7b92c2ca1ca291a1824d743cbd00c4a3e48e # v0.1.2-next.00ac7b9
    with:
      profile: default
      ratchet_mode: line
      # Per-repo config: the gate STILL scans every file (incl. templates/); this
      # only exempts one unavoidable, FULL-LINE-ANCHORED schema-version literal
      # ("apiVersion": "vN.N") a scaffold dashboard.json carries. cinatra#402.
      config: .source-leak-gate.json
      ref: 00ac7b92c2ca1ca291a1824d743cbd00c4a3e48e
