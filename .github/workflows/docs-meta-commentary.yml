name: docs-meta-commentary

# Runs the reusable meta-commentary gate (cinatra-ai/ci) against this repo's
# published Markdown surfaces — the root README.md and CHANGELOG.md (this repo
# has no docs/ tree), as recorded for this repo in cinatra-ai/ci
# config/meta-commentary-inventory.json (cinatra-ai/docs#156): fails a PR when
# a published, user-facing page carries meta/implementation commentary about
# how the docs THEMSELVES are produced — generation mechanics,
# "forthcoming"/placeholder transition notes, editorial TODOs, and the like.
# Wires cinatra-ai/docs#119 into this repo.
#
# Both the workflow ref (`@<sha>`) and the `ref` input are pinned to the SAME
# cinatra-ai/ci commit SHA, so the gate engine is not pulled from mutable main.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  meta-commentary-gate:
    uses: cinatra-ai/ci/.github/workflows/meta-commentary-gate.yml@0a0152451b3a5bd80a47e728b38a46e65a2faa32 # v0.1.3-next.0a01524
    with:
      paths: |
        README.md
        CHANGELOG.md
      ref: 0a0152451b3a5bd80a47e728b38a46e65a2faa32
