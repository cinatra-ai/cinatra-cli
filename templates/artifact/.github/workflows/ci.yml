name: ci

# Standalone CI for a Cinatra extension repo.
#
# Baseline gate (build job) applies to every kind: dep-shape classification,
# install/typecheck/test (for standalone repos), and `npm pack --dry-run`.
# The ARTIFACT kind has no extra kind-specific gate today (only agent and
# workflow ship the self-contained extension-kind-gate.mjs); the build job's
# typecheck of the SemanticArtifactManifest + the pack dry-run are the relevant
# checks. The authoritative manifest validation runs marketplace-side.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable corepack
        run: corepack enable

      - name: Classify repo + validate first-party dep shape
        # First-party @cinatra-ai/* packages (sdk-extensions, sdk-ui, ...) are
        # declared as OPTIONAL peerDependencies. FAIL (exit 2) if any first-party
        # package leaked into dependencies/devDependencies/optionalDependencies,
        # or if a first-party peer is missing peerDependenciesMeta.optional.
        # A repo that declares such optional peers is treated as a source mirror
        # (the host workspace provides/builds/typechecks/tests these), so the
        # standalone install/typecheck/test below are skipped. A truly standalone
        # repo (0 first-party deps) gets the full install + typecheck + test.
        run: |
          code=0
          node -e '
            const p = require("./package.json");
            const fp = (o) => Object.keys(o || {}).filter((k) => k.startsWith("@cinatra-ai/") || k.startsWith("@cinatra/"));
            const leaked = [...fp(p.dependencies), ...fp(p.devDependencies), ...fp(p.optionalDependencies)];
            if (leaked.length) { console.error("First-party packages must be OPTIONAL peerDependencies, not deps/devDeps: " + leaked.join(", ")); process.exit(2); }
            const peers = fp(p.peerDependencies);
            const meta = p.peerDependenciesMeta || {};
            const notOptional = peers.filter((k) => !(meta[k] && meta[k].optional === true));
            if (notOptional.length) { console.error("First-party peer(s) must be marked peerDependenciesMeta.optional: " + notOptional.join(", ")); process.exit(2); }
            process.exit(peers.length ? 0 : 1);
          ' || code=$?
          if [ "$code" -eq 2 ]; then
            echo "::error::First-party @cinatra-ai/* dependency-shape regression (see above)."
            exit 1
          elif [ "$code" -eq 0 ]; then
            echo "first_party=1" >> "$GITHUB_ENV"
            echo "Declares host-internal @cinatra-ai/* optional peers — the host workspace provides/builds/typechecks/tests these. Skipping standalone install + typecheck + test."
          else
            echo "first_party=0" >> "$GITHUB_ENV"
            echo "Standalone repo: no host-internal @cinatra-ai/* peers — running full install + typecheck + test."
          fi

      - name: Install dependencies
        run: |
          if [ "$first_party" = "1" ]; then
            echo "Skipping standalone install (host-internal @cinatra-ai/* peers are resolved by the host workspace)."
            exit 0
          fi
          corepack pnpm install --no-frozen-lockfile

      - name: Typecheck
        # Typecheck the repo's OWN TypeScript sources. Content-only extensions
        # that ship no tracked TS are skipped (tsc would error TS18003).
        run: |
          if [ "$first_party" = "1" ]; then
            echo "Skipping standalone typecheck (host-internal @cinatra-ai/* peers are typechecked by the host workspace)."
            exit 0
          elif node -e "process.exit(((require('./package.json').scripts)||{}).typecheck?0:1)"; then
            corepack pnpm run typecheck
          elif [ -z "$(git ls-files '*.ts' '*.tsx' '*.mts' '*.cts')" ]; then
            echo "No TypeScript sources tracked — nothing to typecheck (content-only extension)."
            exit 0
          elif node -e "p=require('./package.json');d={...p.dependencies,...p.devDependencies};process.exit(d.typescript?0:1)"; then
            corepack pnpm exec tsc --noEmit
          else
            npx -y -p typescript tsc --noEmit
          fi

      - name: Test
        # WHY THIS SKIP EXISTS, AND WHAT IT ACTUALLY DEPENDS ON.
        #
        # A repo declaring host-internal @cinatra-ai/* peers cannot run its
        # tests standalone: those peers live only in the cinatra monorepo and
        # resolve nowhere else. The host runs them instead — but that is a
        # CONDITIONAL claim, and this workflow can verify none of it, so the
        # conditions are written down rather than assumed:
        #
        #   1. NECESSARY: the repo is ENROLLED in one of the host's clone-back
        #      locks (cinatra-required-extensions.lock.json for the production
        #      bootable set, cinatra-dev-extensions.lock.json otherwise). Until
        #      it is, the host never materializes this package, and NOTHING runs
        #      these tests — not this workflow, not the host. A freshly
        #      scaffolded repo is in exactly that state.
        #   2. RECOMMENDED: ship a package-local vitest.config.ts. A package
        #      without one does still run — the host discovers it — but it
        #      inherits the HOST ROOT config, whose `include` is written for the
        #      host tree, so any test file outside that shape is collected by
        #      nobody. The host gate treats that as a failure rather than
        #      ignoring it, which is a red build instead of silent non-coverage.
        #
        # Once enrolled, the host's discovery gate
        # (scripts/ci/extension-suite-gate.mjs, inside the REQUIRED "Perpetual
        # system loops invariants" check) runs this suite on every non-skipped
        # host validation run — draft and docs-only PRs green-stub that job by
        # design — and fails if any on-disk test file went unexecuted. That gate
        # also fails if a repo skips its tests here while the host does not run
        # them, so the claim below cannot go quietly stale.
        #
        # This wording replaces "the cinatra monorepo runs these", asserted
        # unconditionally and false for 32 of 36 repos when cinatra#2288
        # measured it: ~1,600 tests across 30+ suites were running in no gate
        # anywhere, each repo's CI pointing at a host that was not looking.
        run: |
          if [ "$first_party" = "1" ]; then
            echo "Skipping standalone tests: host-internal @cinatra-ai/* peers resolve only in the cinatra monorepo."
            echo "The host runs this suite ONLY once this repo is enrolled in a cinatra clone-back lock — until then nothing runs these tests. See the comment above."
            exit 0
          fi
          corepack pnpm test --if-present

      - name: Pack (dry run)
        # Validates package shape + publish payload without resolving peers.
        run: npm pack --dry-run

  kind-gates:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Artifact manifest validation gate
        # Validate this repo's artifact descriptor (name @cinatra-ai/<slug>-artifact,
        # kind, NO cinatra.oas, the cinatra.artifact accepts/templates/skills
        # descriptor, allowed-keys allowlist) plus the common cross-kind rules,
        # via the self-contained, zero-dependency gate shipped in this repo.
        # Mirrors the authoritative install-pipeline rules.
        run: node extension-kind-gate.mjs --package-root .
